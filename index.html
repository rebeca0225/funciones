<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>15 Funciones JavaScript</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-purple-100 min-h-screen py-8 px-4">

    <div class="max-w-6xl mx-auto">

        <!-- TÍTULO -->
        <h1 class="text-4xl font-bold text-purple-700 text-center mb-3">
            15 FUNCIONES EN JAVACRIPT 
        </h1>

        <p class="text-center text-gray-600 mb-8 uppercase">
            Escribe dos números y selecciona la operación
        </p>

        <!-- CALCULADORA -->
        <div class="bg-white p-8 rounded-2xl shadow-lg">

            <!-- NÚMERO 1 -->
            <label for="numero1" class="block font-bold text-gray-700 mb-2">
                Número 1
            </label>

            <input
                type="number"
                id="numero1"
                placeholder="Escribe el primer número"
                class="w-full p-3 mb-5 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-600"
            >

            <!-- NÚMERO 2 -->
            <label for="numero2" class="block font-bold text-gray-700 mb-2">
                Número 2
            </label>

            <input
                type="number"
                id="numero2"
                placeholder="Escribe el segundo número"
                class="w-full p-3 mb-6 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-600"
            >

            <!-- OPERACIONES -->
            <h2 class="text-2xl font-bold text-purple-700 text-center mb-6">
                Operaciones
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

                <button onclick="sumar()" class="boton">Sumar</button>
                <button onclick="restar()" class="boton">Restar</button>
                <button onclick="multiplicar()" class="boton">Multiplicar</button>
                <button onclick="dividir()" class="boton">Dividir</button>

                <button onclick="potencia()" class="boton">Potencia</button>
                <button onclick="numeroMayor()" class="boton">Número mayor</button>
                <button onclick="numeroMenor()" class="boton">Número menor</button>
                <button onclick="promedio()" class="boton">Promedio</button>

                <button onclick="porcentaje()" class="boton">Porcentaje</button>
                <button onclick="descuento()" class="boton">Descuento</button>

                <button onclick="areaRectangulo()" class="boton">
                    Área rectángulo
                </button>

                <button onclick="perimetroRectangulo()" class="boton">
                    Perímetro rectángulo
                </button>

                <button onclick="areaTriangulo()" class="boton">
                    Área triángulo
                </button>

                <button onclick="areaCuadrado()" class="boton">
                    Área cuadrado
                </button>

                <button onclick="perimetroCuadrado()" class="boton">
                    Perímetro cuadrado
                </button>

                <button onclick="raizNumero1()" class="boton">
                    Raíz número 1
                </button>
 n     

            </div>

            <!-- RESULTADO -->
            <div class="mt-8 p-6 bg-purple-50 border-2 border-purple-200 rounded-xl">

                <h2 class="text-2xl font-bold text-purple-700 text-center mb-4">
                    Resultado
                </h2>

                <p id="resultado" class="text-center text-xl text-gray-700">
                    Resultado:
                </p>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
