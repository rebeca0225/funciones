<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Funciones JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>30 Funciones en JavaScript</h1>
        <p>ESCRIBE DOS NUMEROS Y SELECCIONA LA OPERACION</p>

        <div class="calculadora">

            <label for="numero1">Número 1</label>
            <input type="number" id="numero1" placeholder="Escribe el primer número">

            <label for="numero2">Número 2</label>
            <input type="number" id="numero2" placeholder="Escribe el segundo número">

            <h2>Operaciones</h2>

            <div class="botones">

                <button onclick="sumar()">Sumar</button>
                <button onclick="restar()">Restar</button>
                <button onclick="multiplicar()">Multiplicar</button>
                <button onclick="dividir()">Dividir</button>

                <button onclick="potencia()">Potencia</button>
                <button onclick="numeroMayor()">Número mayor</button>
                <button onclick="numeroMenor()">Número menor</button>

                <button onclick="promedio()">Promedio</button>
                <button onclick="porcentaje()">Porcentaje</button>
                <button onclick="descuento()">Descuento</button>

                <button onclick="areaRectangulo()">Área rectángulo</button>
                <button onclick="perimetroRectangulo()">Perímetro rectángulo</button>

                <button onclick="areaTriangulo()">Área triángulo</button>
                <button onclick="areaCuadrado()">Área cuadrado</button>
                <button onclick="perimetroCuadrado()">Perímetro cuadrado</button>

                <button onclick="raizNumero1()">Raíz número 1</button>
                <button onclick="cuadrado()">Cuadrado</button>
                <button onclick="cubo()">Cubo</button>

                <button onclick="kilometrosMetros()">Km → metros</button>
                <button onclick="metrosCentimetros()">Metros → cm</button>

                <button onclick="horasMinutos()">Horas → minutos</button>
                <button onclick="minutosSegundos()">Minutos → segundos</button>

                <button onclick="celsiusFahrenheit()">Celsius → Fahrenheit</button>

            </div>

            <div class="resultado">
                <h2>Resultado</h2>
                <p id="resultado">Resultado:</p>
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
